name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# A second push supersedes the first; the older run's verdict is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token for every job; no job pushes, comments, or calls the API.
permissions:
  contents: read

jobs:
  # Link additions only touch the JSON stores and generated feeds, which cannot
  # break the bundle. Those pushes skip `build` and get `data` alone.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Detect non-data changes
      id: filter
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.sha }}
      run: |
        # New branch, force push, or a base we no longer have: assume code changed.
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
           || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "base unavailable - running full build"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        changed=$(git diff --name-only "$BASE" "$HEAD")
        echo "$changed"
        # grep -qv succeeds when any line is NOT a data path. An empty diff
        # yields one empty line, which also fails the pattern, so it fails safe.
        if echo "$changed" | grep -qvE '^(data/|public/data/|public/feed)'; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "data-only push - skipping build"
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi

  # Cheap and unconditional: links.json is the source of truth, so it gets
  # checked on every push including the data-only ones that skip `build`.
  data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate data files
      run: npx vitest run tests/data-integrity.test.js

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npx vitest run

    - name: Run build
      run: npm run build

    - name: Check for lint issues
      run: npm run lint || true
      continue-on-error: true

    # Bookmark parser test removed - uses browser-specific DOMParser not available in Node

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: success()
      with:
        name: dist
        path: dist

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
      with:
        path: ./
        extra_args: --debug --only-verified
